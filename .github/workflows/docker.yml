name: Docker

# Dockerfile でサイトをビルドする。
# - PR では、ビルドが通るかだけを確かめる(壊れた変更が main に入ってデプロイで落ちないように。
#   Renovate の自動マージもこのチェックを待つ)
# - main への push(と main での workflow_dispatch)では、イメージを ghcr.io に公開し、
#   deploy/deployment.yaml のイメージのタグを書き換えて push する(Argo CD がデプロイする)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # PR(と main 以外のブランチでの workflow_dispatch)では、ビルドが通るかだけを確かめる
  build:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main では、ビルドしたイメージを公開してデプロイのタグを書き換える
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # コンテナのリポジトリ名は小文字でなければならないため変換する
      - name: Resolve image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pushes with the default GITHUB_TOKEN don't trigger new workflow runs,
      # so this commit does not re-trigger this workflow.
      - name: Update deployment image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 連続した push が先に main を進めていることがある。
          # 自分のコミットを rebase すると image: の同じ行でほぼ必ず衝突するため、
          # 毎回 main を取り直して sed をやり直す。この操作は冪等。
          for _ in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            sed -i "s#image: ${REGISTRY}/${IMAGE_NAME}:.*#image: ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}#" deploy/deployment.yaml

            if git diff --quiet -- deploy/deployment.yaml; then
              echo "変更なし"
              exit 0
            fi

            git add deploy/deployment.yaml
            git commit --quiet -m "chore: update corp image to ${GITHUB_SHA}"

            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
