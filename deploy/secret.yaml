# Secret corp-secrets は Infisical (il.doany.io) のフォルダ /corp/corp-secrets にあり、
# Infisical 純正 operator が Secret にする。キーは contact-webhook-url (hookshot の汎用 webhook の URL) と
# turnstile-secret (Cloudflare Turnstile の「doany.io」ウィジェットのシークレットキー。yosegaki と同じ)。
# 値は Infisical の UI で書き換えるだけ (auto-reload 注釈のある Deployment は自動で入れ替わる)。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: corp-secrets
  namespace: corp
  # 2 つとも必須。danything/gitops の bootstrap/README.md「InfisicalSecret には sync-options を 2 つ付けること」
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: doa
        envSlug: prod
        secretsPath: /corp/corp-secrets
        recursive: false
  managedKubeSecretReferences:
    - secretName: corp-secrets
      secretNamespace: corp
      # Orphan: CR を消しても Secret は残す (移行や再作成で稼働中の Pod を巻き込まない)
      creationPolicy: Orphan
