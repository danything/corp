apiVersion: apps/v1
kind: Deployment
metadata:
  name: corp
  namespace: corp
  annotations:
    # 参照している Secret が変わったら、Reloader が自動でローリング再起動する
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 新しい Pod が Ready になってから古い Pod を落とす
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: corp
  template:
    metadata:
      labels:
        app: corp
    spec:
      # Bun は root ではない uid (Dockerfile の USER と同じ) で、8080 番で待つ
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: corp
          image: ghcr.io/danything/corp:c98128144a6f4e113ae5ce9c3698599adb5e43f7
          ports:
            - name: http
              containerPort: 8080
          env:
            # 問い合わせの送り先 (matrix-hookshot の汎用 webhook) と Turnstile のシークレット。
            # Secret corp-secrets (secrets.sops.yaml)
            - name: CONTACT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: corp-secrets
                  key: contact-webhook-url
            # 問い合わせを記録する Twenty。クラスタの中から直接つなぐ (Cloudflare を通らない)。
            # キーは Twenty のロール「corp のお問い合わせ」の API キー。Secret に無ければ Twenty を使わず、上の webhook に直接送る
            - name: TWENTY_URL
              value: http://twenty.twenty.svc:3000
            - name: TWENTY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: corp-secrets
                  key: twenty-api-key
                  optional: true
            # タスクの担当 (Twenty のワークスペースのメンバー info@doany.io)
            - name: TWENTY_ASSIGNEE_ID
              value: 765420f9-76d3-463f-9afc-635176dcbc8b
            - name: TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: corp-secrets
                  key: turnstile-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          # 止める前に少し待つ。Pod の終了と Service の宛先から外れるのが同時に進むので、待たないと
          # 外れる前の数秒に来たリクエストが落ちる (ブログと同じ)。イメージ (distroless) に sleep の
          # コマンドは無いので、kubelet が待つ sleep を使う
          lifecycle:
            preStop:
              sleep:
                seconds: 5
